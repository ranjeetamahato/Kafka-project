spring.application.name=delivery-service

server.port=8082

spring.datasource.url=jdbc\:mysql://localhost:3306/9th_march_2026

spring.datasource.username=root

spring.datasource.password=Mahato\@17

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

# Kafka Broker

spring.kafka.bootstrap-servers=localhost:9092


# How to deserialize key and value

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer

spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# JSON Deserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=*

# Consumer Group

spring.kafka.consumer.group-id=delivery-service-group

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer

spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer